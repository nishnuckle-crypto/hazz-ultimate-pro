  if (module === 'analysis') {
  content.innerHTML = `
    <h3>📊 MARKET ANALYSIS</h3>
    <p>TECHNICAL & SMART MONEY CONCEPTS</p>

    <div class="news-card">
      <h4>MARKET DATA INPUT</h4>

      <label>SYMBOL</label>
      <select id="analysisSymbol">
        <option>XAUUSD</option>
        <option>EURUSD</option>
        <option>GBPUSD</option>
        <option>USDJPY</option>
        <option>GBPJPY</option>
      </select>

      <label>TIMEFRAME</label>
      <select id="analysisTimeframe">
        <option>M15</option>
        <option>M30</option>
        <option>H1</option>
        <option>H4</option>
        <option>D1</option>
      </select>

      <h4>OHLC PRICE DATA</h4>

      <input id="candleOpen" type="number" step="any" placeholder="OPEN">
      <input id="candleHigh" type="number" step="any" placeholder="HIGH">
      <input id="candleLow" type="number" step="any" placeholder="LOW">
      <input id="candleClose" type="number" step="any" placeholder="CLOSE">
      <h4>PREVIOUS CANDLE OHLC</h4>
      
      <input id="prevOpen" type="number" step="any" placeholder="PREVIOUS OPEN">
      <input id="prevHigh" type="number" step="any" placeholder="PREVIOUS HIGH">
      <input id="prevLow" type="number" step="any" placeholder="PREVIOUS LOW">
      <input id="prevClose" type="number" step="any" placeholder="PREVIOUS CLOSE">
      
      <h4>THIRD CANDLE OHLC</h4>
      <input id="thirdOpen" type="number" step="any" placeholder="THIRD OPEN">
      <input id="thirdHigh" type="number" step="any" placeholder="THIRD HIGH">
      <input id="thirdLow" type="number" step="any" placeholder="THIRD LOW">
      <input id="thirdClose" type="number" step="any" placeholder="THIRD CLOSE">
      
      <button id="calculateCandle" class="ai-analyze-button">
      ANALYZE MARKET
      </button>
    </div>

    <div id="technicalResult" class="ai-analysis-panel">
      <h4>TECHNICAL ANALYSIS</h4>
      <p>Enter OHLC data to begin analysis.</p>
    </div>

    <p class="muted">
      MANUAL DATA MODE • LIVE MARKET FEED NOT CONNECTED
    </p>
  `;

  document.getElementById('calculateCandle')
    .addEventListener('click', () => {

      const o = Number(document.getElementById('candleOpen').value);
      const h = Number(document.getElementById('candleHigh').value);
      const l = Number(document.getElementById('candleLow').value);
      const c = Number(document.getElementById('candleClose').value);
      const po = Number(document.getElementById('prevOpen').value);
      const ph = Number(document.getElementById('prevHigh').value);
      const pl = Number(document.getElementById('prevLow').value);
      const pc = Number(document.getElementById('prevClose').value);
      const to = Number(document.getElementById('thirdOpen').value);
      const th = Number(document.getElementById('thirdHigh').value);
      const tl = Number(document.getElementById('thirdLow').value);
      const tc = Number(document.getElementById('thirdClose').value);
      
      const result = document.getElementById('technicalResult');

      if (
  ![o, h, l, c, po, ph, pl, pc, to, th, tl, tc].every(Number.isFinite) ||
  ['candleOpen','candleHigh','candleLow','candleClose',
   'prevOpen','prevHigh','prevLow','prevClose',
   'thirdOpen','thirdHigh','thirdLow','thirdClose']
    .some(id => document.getElementById(id).value.trim() === '') ||
  h < Math.max(o, c) ||
  l > Math.min(o, c) ||
  h < l ||
  ph < Math.max(po, pc) ||
  pl > Math.min(po, pc) ||
  ph < pl ||
  th < Math.max(to, tc) ||
  tl > Math.min(to, tc) ||
  th < tl    
) {
  result.innerHTML =
    '<h4>INVALID PRICE DATA</h4><p>Please check OHLC values.</p>';
  return;
}

      const range = h - l;
      const body = Math.abs(c - o);
      const bodyPercent = range > 0 ? body / range * 100 : 0;
      const prevBody = Math.abs(pc - po);
      const prevBullish = pc > po;
      const prevBearish = pc < po;
      
      const upperWick = h - Math.max(o, c);
      const lowerWick = Math.min(o, c) - l;
      
      const isDoji = range > 0 && bodyPercent <= 10;
      
      const bullishEngulfing =
        prevBearish && c > o && o <= pc && c >= po;
      
      const bearishEngulfing =
        prevBullish && c < o && o >= pc && c <= po;
      
      const bullishMarubozu =
        c > o && range > 0 && bodyPercent >= 90;
      
      const bearishMarubozu =
        c < o && range > 0 && bodyPercent >= 90;
      
      const hammer =
        body > 0 &&
        lowerWick >= body * 2 &&
        upperWick <= body * 0.5;
      
      const shootingStar =
        body > 0 &&
        upperWick >= body * 2 &&
        lowerWick <= body * 0.5;
      // THREE-CANDLE PATTERN DETECTION
      
      const prevRange = ph - pl;
      const prevBodyPercent =
        prevRange > 0 ? prevBody / prevRange * 100 : 0;
      
      const thirdBody = Math.abs(tc - to);
      const thirdRange = th - tl;
      const thirdBodyPercent =
        thirdRange > 0 ? thirdBody / thirdRange * 100 : 0;
      
      const morningStar =
        prevBearish &&
        prevBodyPercent >= 50 &&
        bodyPercent <= 30 &&
        tc > to &&
        thirdBodyPercent >= 50 &&
        tc > (po + pc) / 2;
      
      const eveningStar =
        prevBullish &&
        prevBodyPercent >= 50 &&
        bodyPercent <= 30 &&
        tc < to &&
        thirdBodyPercent >= 50 &&
        tc < (po + pc) / 2;
      
      const threeWhiteSoldiers =
        prevBullish && c > o && tc > to &&
        pc > po && c > pc && tc > c &&
        prevBodyPercent >= 50 &&
        bodyPercent >= 50 &&
        thirdBodyPercent >= 50;
      
      const threeBlackCrows =
        prevBearish && c < o && tc < to &&
        pc < po && c < pc && tc < c &&
        prevBodyPercent >= 50 &&
        bodyPercent >= 50 &&
        thirdBodyPercent >= 50;
      
      let candlePattern = 'NO CLEAR PATTERN';
      
      if (morningStar) {
        candlePattern = 'MORNING STAR';
      } else if (eveningStar) {
        candlePattern = 'EVENING STAR';
      } else if (threeWhiteSoldiers) {
        candlePattern = 'THREE WHITE SOLDIERS';
      } else if (threeBlackCrows) {
        candlePattern = 'THREE BLACK CROWS';
      } else if (bullishEngulfing) {
        candlePattern = 'BULLISH ENGULFING';
      } else if (bearishEngulfing) {
        candlePattern = 'BEARISH ENGULFING';
      } else if (bullishMarubozu) {
        candlePattern = 'BULLISH MARUBOZU';
      } else if (bearishMarubozu) {
        candlePattern = 'BEARISH MARUBOZU';
      } else if (isDoji) {
        candlePattern = 'DOJI';
      } else if (hammer) {
        candlePattern = 'HAMMER';
      } else if (shootingStar) {
        candlePattern = 'SHOOTING STAR';
}
      const direction = c > o ? 'BULLISH CANDLE'
        : c < o ? 'BEARISH CANDLE'
        : 'NEUTRAL CANDLE';

      result.innerHTML = `
        <h4>TECHNICAL ANALYSIS RESULT</h4>
        <p>SYMBOL: ${document.getElementById('analysisSymbol').value}</p>
        <p>TIMEFRAME: ${document.getElementById('analysisTimeframe').value}</p>
        <p>CANDLE DIRECTION: ${direction}</p>
        <p>CANDLE PATTERN: ${candlePattern}</p>
        <p>PRICE RANGE: ${range}</p>
        <p>BODY SIZE: ${body}</p>
        <p>BODY STRENGTH: ${bodyPercent.toFixed(2)}%</p>
        <p>OPEN: ${o}</p>
        <p>HIGH: ${h}</p>
        <p>LOW: ${l}</p>
        <p>CLOSE: ${c}</p>
        <p>NOTE: Up to three-candle pattern analysis. No BUY/SELL signal generated.</p>
      `;
    });

  return;
}

  content.innerHTML = `
    <h3>${selected[0]}</h3>
    <p>${selected[1]}</p>
    <p>MODULE INITIALIZING...</p>
  `;
};

</script>
