
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>HAZZ ULTIMATE PRO</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#eee;font-family:Arial,sans-serif}
header{padding:22px;border-bottom:1px solid #594a2c;background:#111}
.logo{color:#d9b56d;font-size:22px;font-weight:bold;letter-spacing:2px}
.sub{color:#999;font-size:10px;letter-spacing:3px;margin-top:7px}
main{max-width:500px;margin:35px auto;padding:18px}
.panel{background:#141414;border:1px solid #403727;border-radius:12px;padding:22px}
h2{color:#d9b56d;font-size:16px}
input{width:100%;padding:14px;margin:8px 0;background:#080808;color:white;border:1px solid #444;border-radius:7px}
button{width:100%;padding:14px;margin-top:12px;background:#d9b56d;border:0;border-radius:7px;font-weight:bold}
.switch{background:#292929;color:white}
.muted{color:#999;font-size:12px;text-align:center}
#dashboard{display:none}

.module-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  margin: 22px 0;
}

.module-grid button {
  background: linear-gradient(135deg,#252016,#111);
  color: #d9b56d;
  border: 1px solid #806735;
  border-radius: 9px;
  padding: 18px;
  text-align: left;
  font-size: 13px;
  letter-spacing: 1px;
}

.module-grid button:active {
  background: #40331c;
}

.module-content {
  background: #090909;
  border: 1px solid #403727;
  border-radius: 9px;
  padding: 18px;
  min-height: 130px;
  margin-bottom: 15px;
}

.module-content h3 {
  color: #d9b56d;
  font-size: 14px;
}

.module-content p {
  color: #999;
  font-size: 12px;
}

.news-card {
  background: #171717;
  border: 1px solid #594a2c;
  border-radius: 9px;
  padding: 15px;
  margin: 12px 0;
}

.news-card h4 {
  color: #d9b56d;
  font-size: 13px;
  margin: 0 0 10px;
}

.news-card p {
  color: #eee;
  font-size: 12px;
}

.news-card span {
  color: #999;
  font-size: 10px;
  letter-spacing: 1px;
}
.news-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}

.sentiment-tag,
.impact-tag {
  display: inline-block;
  padding: 6px 10px;
  border-radius: 5px;
  font-size: 10px;
  font-weight: bold;
  letter-spacing: 1px;
  border: 1px solid #806735;
}

.sentiment-tag {
  color: #d9b56d;
  background: #211b10;
}

.impact-tag {
  color: #fff;
  background: #252525;
}

.calendar-filters {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 15px 0;
}

.calendar-filters select {
  width: 100%;
  background: #171717;
  color: #d9b56d;
  border: 1px solid #806735;
  border-radius: 7px;
  padding: 12px 8px;
  font-size: 11px;
  font-weight: bold;
  outline: none;
}

.calendar-filters select:focus {
  border-color: #d9b56d;
}

.event-countdown {
  margin-top: 12px;
  padding: 12px;
  background: linear-gradient(135deg, #211b10, #090909);
  border: 1px solid #806735;
  border-radius: 7px;
  color: #d9b56d;
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 1px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

.ai-analyze-button {
  width: 100%;
  padding: 13px;
  margin-top: 12px;
  background: linear-gradient(135deg, #d6a83b, #8b681e);
  color: #080808;
  border: none;
  border-radius: 8px;
  font-weight: 800;
  cursor: pointer;
}

.ai-analyze-button:disabled {
  opacity: 0.6;
  cursor: wait;
}

.ai-analysis-panel {
  margin-top: 14px;
  padding: 15px;
  background: #171717;
  border: 1px solid #a98232;
  border-radius: 10px;
  color: #f5f5f5;
  line-height: 1.6;
}

.ai-analysis-panel h4 {
  color: #e5bd58;
  margin-top: 0;
}
</style>
</head>
<body>
<header>
<div class="logo">HAZZ ULTIMATE PRO</div>
<div class="sub">AI TRADING INTELLIGENCE</div>
</header>

<main>
<section class="panel" id="authPanel">
<h2 id="formTitle">WELCOME BACK</h2>
<p class="muted">SECURE MEMBER ACCESS</p>
<input id="email" type="email" placeholder="Email address">
<input id="password" type="password" placeholder="Password">
<button id="authButton">LOGIN</button>
<button class="switch" id="switchButton">CREATE ACCOUNT</button>
<p class="muted" id="message"></p>
</section>


<section class="panel" id="dashboard">
  <h2>HAZZ ULTIMATE PRO</h2>
  <p class="muted" id="userEmail"></p>

  <div class="module-grid">
    <button onclick="openModule('news')">📰 AI NEWS INTELLIGENCE</button>
    <button onclick="openModule('signals')">📈 AI SIGNAL ENGINE</button>
    <button onclick="openModule('calendar')">📅 ECONOMIC CALENDAR</button>
    <button onclick="openModule('analysis')">📊 MARKET ANALYSIS</button>
    <button onclick="openModule('status')">🟢 LIVE MARKET STATUS</button>
  </div>

  <div id="moduleContent" class="module-content">
    <h3>WELCOME TO YOUR TRADING TERMINAL</h3>
    <p>Select a module to continue.</p>
  </div>

  <button id="logoutButton">LOGOUT</button>
</section>

</main>


<script type="module">
import { createClient } from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase = createClient(
  'https://onxbtoovnxduckkwydhm.supabase.co',
  'sb_publishable_vvK94NzTotPXrH9DOXqTQA_O6P_EiJd'
);

let isRegister = false;

const email = document.getElementById('email');
const password = document.getElementById('password');
const message = document.getElementById('message');
const authPanel = document.getElementById('authPanel');
const dashboard = document.getElementById('dashboard');

function showDashboard(user) {
  authPanel.style.display = 'none';
  dashboard.style.display = 'block';
  document.getElementById('userEmail').textContent = user.email;
}

function showLogin() {
  dashboard.style.display = 'none';
  authPanel.style.display = 'block';
}

document.getElementById('switchButton').onclick = () => {
  isRegister = !isRegister;

  document.getElementById('formTitle').textContent =
    isRegister ? 'CREATE ACCOUNT' : 'WELCOME BACK';

  document.getElementById('authButton').textContent =
    isRegister ? 'REGISTER' : 'LOGIN';

  document.getElementById('switchButton').textContent =
    isRegister ? 'BACK TO LOGIN' : 'CREATE ACCOUNT';

  message.textContent = '';
};

document.getElementById('authButton').onclick = async () => {
  const e = email.value.trim();
  const p = password.value;

  if (!e || !p) {
    message.textContent = 'Enter email and password.';
    return;
  }

  message.textContent = 'Connecting...';

  try {
    const result = isRegister
      ? await supabase.auth.signUp({ email: e, password: p })
      : await supabase.auth.signInWithPassword({ email: e, password: p });

    if (result.error) {
      message.textContent = JSON.stringify({
        name: result.error.name,
        message: result.error.message,
        status: result.error.status,
        code: result.error.code
      });
      return;
    }

    if (isRegister && !result.data.session) {
      message.textContent = 'Check your email to confirm registration.';
      return;
    }

    if (result.data.user) showDashboard(result.data.user);

  } catch (err) {
    message.textContent = err.name + ': ' + err.message;
  }
};


window.openModule = function(module) {
  const content = document.getElementById('moduleContent');

  const modules = {
    news: ['AI NEWS INTELLIGENCE', 'Live Forex & Gold News'],
    signals: ['AI SIGNAL ENGINE', 'BUY / SELL Market Signals'],
    calendar: ['ECONOMIC CALENDAR', 'CPI • NFP • FOMC • PCE'],
    analysis: ['MARKET ANALYSIS', 'Technical & Smart Money Concepts'],
    status: ['LIVE MARKET STATUS', 'Market Connection Status']
  };

  const selected = modules[module];
  

if (module === 'news') {
  content.innerHTML = `
    <h3>AI NEWS INTELLIGENCE</h3>
    <p id="newsStatus">Connecting to live news...</p>
    <div id="liveNewsFeed"></div>
  `;

  async function loadNews() {
    const status = document.getElementById('newsStatus');
    const feed = document.getElementById('liveNewsFeed');

    if (!status || !feed) return;

    try {
      status.textContent = 'Updating live news...';

      const response = await fetch('/api/news');

      if (!response.ok) {
        throw new Error('News HTTP ' + response.status);
      }

      const data = await response.json();

      if (!data.success) {
        throw new Error(data.error || 'News unavailable');
      }

      const articles = (data.articles || []).slice(0, 20);

      const escapeHTML = value =>
        String(value || '').replace(/[&<>"']/g, char => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        })[char]);

      status.textContent =
        `${data.total} ARTICLES • ${data.source} • UPDATED ${new Date().toLocaleTimeString()}`;

      feed.innerHTML = articles.map((article, index) => `
        <div class="news-card">
          <h4>${escapeHTML(article.title)}</h4>

          <p>${escapeHTML(article.source)}</p>

          <span>${escapeHTML(article.published_at)}</span>

          <div class="news-tags">
            <span class="sentiment-tag">
              ${escapeHTML(article.sentiment)}
            </span>

            <span class="impact-tag">
              IMPACT: ${escapeHTML(article.impact)}
            </span>
          </div>

          <p>
            <a href="${escapeHTML(article.url)}"
               target="_blank"
               rel="noopener noreferrer">
              READ FULL NEWS ↗
            </a>
          </p>

          <button
            type="button"
            class="ai-analyze-button"
            data-index="${index}">
            ✨ ANALYZE WITH AI
          </button>

          <div class="ai-analysis-result"></div>
        </div>
      `).join('');

      feed.querySelectorAll('.ai-analyze-button').forEach(button => {
        button.addEventListener('click', async () => {

          const article = articles[Number(button.dataset.index)];
          const card = button.closest('.news-card');
          const resultBox = card.querySelector('.ai-analysis-result');

          if (!article || !resultBox) return;

          button.disabled = true;
          button.textContent = 'AI ANALYZING...';

          resultBox.innerHTML =
            '<p>AI is analyzing this news. Please wait...</p>';

          try {
            const aiResponse = await fetch('/api/ai-news', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                title: article.title,
                source: article.source,
                published_at: article.published_at
              })
            });

            const aiData = await aiResponse.json();

            if (!aiResponse.ok || !aiData.success) {
              throw new Error(
                aiData.error || 'AI analysis failed'
              );
            }

            const a = aiData.analysis || {};

            const safe = value =>
              escapeHTML(value || '--');

            resultBox.innerHTML = `
              <div class="ai-analysis-panel">

                <h4>✨ AI ANALYSIS RESULT</h4>

                <p>
                  <b>SUMMARY</b><br>
                  ${safe(a.summary)}
                </p>

                <p>
                  <b>MARKET SENTIMENT</b><br>
                  ${safe(a.sentiment)}
                </p>

                <p>
                  <b>GOLD IMPACT (XAUUSD)</b><br>
                  ${safe(a.gold_impact)}
                </p>

                <p>
                  <b>USD IMPACT</b><br>
                  ${safe(a.usd_impact)}
                </p>

                <p>
                  <b>IMPACT LEVEL</b><br>
                  ${safe(a.impact_level)}
                </p>

                <p>
                  <b>MARKET ANALYSIS</b><br>
                  ${safe(a.market_analysis)}
                </p>

                <p>
                  <b>RISK NOTE</b><br>
                  ${safe(a.risk_note)}
                </p>

                <p>
                  <small>
                    Preliminary AI analysis based on the news headline.
                    Not a guaranteed trading signal.
                  </small>
                </p>

              </div>
            `;

          } catch (error) {
            resultBox.textContent =
              'AI ERROR: ' + error.message;

          } finally {
            button.disabled = false;
            button.textContent = '✨ ANALYZE WITH AI';
          }

        });
      });

    } catch (error) {
      status.textContent =
        'LIVE NEWS ERROR: ' + error.message;
    }
  }

  if (window.newsRefreshTimer) {
    clearInterval(window.newsRefreshTimer);
  }

  loadNews();

  window.newsRefreshTimer =
    setInterval(loadNews, 300000);

  return;
}


if (module === 'calendar') {
  content.innerHTML = `
    <h3>ECONOMIC CALENDAR</h3>
    <p id="calendarStatus">Connecting to economic calendar...</p>
    <div class="calendar-filters">
  <select id="currencyFilter">
    <option value="ALL">ALL CURRENCIES</option>
    <option value="USD">USD</option>
    <option value="EUR">EUR</option>
    <option value="GBP">GBP</option>
    <option value="JPY">JPY</option>
  </select>

  <select id="impactFilter">
    <option value="ALL">ALL IMPACT</option>
    <option value="high">HIGH IMPACT</option>
    <option value="medium">MEDIUM IMPACT</option>
    <option value="low">LOW IMPACT</option>
  </select>
</div>

<div id="calendarFeed"></div>
  `;

  async function loadCalendar() {
    const status = document.getElementById('calendarStatus');
    const feed = document.getElementById('calendarFeed');

    try {
      status.textContent = 'Updating economic events...';

      const response = await fetch('/api/calendar');

      if (!response.ok) {
        throw new Error('HTTP ' + response.status);
      }

      const data = await response.json();

      if (!data.success) {
        throw new Error(data.error || 'Calendar unavailable');
      }

      const escapeHTML = value =>
        String(value || '').replace(/[&<>"']/g, char => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        })[char]);

      const now = Date.now();

      
const currency = document.getElementById('currencyFilter').value;
const impact = document.getElementById('impactFilter').value;

const events = (data.events || [])
  .filter(event =>
    event.time &&
    new Date(event.time).getTime() >= now
  )
  .filter(event =>
    currency === 'ALL' || event.currency === currency
  )
  .filter(event =>
    impact === 'ALL' || event.impact === impact
  )
  .sort((a, b) =>
    new Date(a.time) - new Date(b.time)
  )
  .slice(0, 50);


      status.textContent =
        `${events.length} UPCOMING EVENTS • UPDATED ${new Date().toLocaleTimeString()}`;

      if (!events.length) {
        feed.innerHTML = '<p>No upcoming events found.</p>';
        return;
      }

      feed.innerHTML = events.map(event => {
        const eventTime = new Date(event.time)
          .toLocaleString('en-MY', {
            timeZone: 'Asia/Kuala_Lumpur',
            dateStyle: 'medium',
            timeStyle: 'short'
          });

        return `
          <div class="news-card">
            <h4>${escapeHTML(event.title)}</h4>

            <p>
              ${escapeHTML(event.currency)} •
              ${escapeHTML(event.impact).toUpperCase()}
            </p>

            <span>${escapeHTML(eventTime)} MYT</span>

<div class="event-countdown"
     data-event-time="${new Date(event.time).getTime()}">
  CALCULATING COUNTDOWN...
</div>

            <div class="news-tags">
              <span class="impact-tag">
                ${escapeHTML(event.status || 'SCHEDULED').toUpperCase()}
              </span>
            </div>

            <p>
              FORECAST: ${escapeHTML(event.forecast || '--')}<br>
              PREVIOUS: ${escapeHTML(event.previous || '--')}<br>
              ACTUAL: ${escapeHTML(event.actual || '--')}
            </p>
          </div>
        `;
      }).join('');
      
function updateCountdowns() {
  document.querySelectorAll('.event-countdown').forEach(timer => {
    const target = Number(timer.dataset.eventTime);
    const remaining = target - Date.now();

    if (remaining <= 0) {
      timer.textContent = 'EVENT RELEASED';
      return;
    }

    const totalSeconds = Math.floor(remaining / 1000);

    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    timer.textContent =
      `COUNTDOWN: ${days}D ${hours}H ${minutes}M ${seconds}S`;
  });
}

if (window.eventCountdownTimer) {
  clearInterval(window.eventCountdownTimer);
}

updateCountdowns();

window.eventCountdownTimer =
  setInterval(updateCountdowns, 1000);


    } catch (error) {
      status.textContent = 'CALENDAR ERROR: ' + error.message;
    }
  }

  if (window.calendarRefreshTimer) {
    clearInterval(window.calendarRefreshTimer);
  }

  
document.getElementById('currencyFilter')
  .addEventListener('change', loadCalendar);

document.getElementById('impactFilter')
  .addEventListener('change', loadCalendar);

loadCalendar();

window.calendarRefreshTimer =
  setInterval(loadCalendar, 900000);

return;

}


  if (!selected) return;

  content.innerHTML = `
    <h3>${selected[0]}</h3>
    <p>${selected[1]}</p>
    <p>MODULE INITIALIZING...</p>
  `;
};
document.getElementById('logoutButton').onclick = async () => {
  await supabase.auth.signOut();
  showLogin();
};

const { data: { session } } = await supabase.auth.getSession();

if (session) showDashboard(session.user);

supabase.auth.onAuthStateChange((_event, session) => {
  if (session) showDashboard(session.user);
  else showLogin();
});
</script>
