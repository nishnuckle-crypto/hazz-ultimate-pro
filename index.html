body{margin:0;background:#080808;color:#eee;font-family:Arial,sans-serif}
header{padding:22px;border-bottom:1px solid #594a2c;background:#111}

.module-grid {

.module-content {

.module-content h3 {

.news-tags {

}

.sentiment-tag,

.sentiment-tag {
  color: #d9b56d;

.impact-tag {

  color: #d9b56d;
  border: 1px solid #806735;

  border-radius: 7px;

'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  'https://onxbtoovnxduckkwydhm.supabase.co',

);

let isRegister = false;

const email = document.getElementById('email');
const password = document.getElementById('password');
const message = document.getElementById('message');
const authPanel = document.getElementById('authPanel');
const dashboard = document.getElementById('dashboard');

function showDashboard(user) {
  authPanel.style.display = 'none';
  dashboard.style.display = 'block';
  document.getElementById('userEmail').textContent = user.email;
}

function showLogin() {
  dashboard.style.display = 'none';

}

document.getElementById('switchButton').onclick = () => {
  isRegister = !isRegister;

  document.getElementById('formTitle').textContent =
    isRegister ? 'CREATE ACCOUNT' : 'WELCOME BACK';

  document.getElementById('authButton').textContent =
    isRegister ? 'REGISTER' : 'LOGIN';

  document.getElementById('switchButton').textContent =
    isRegister ? 'BACK TO LOGIN' : 'CREATE ACCOUNT';

  message.textContent = '';
};

document.getElementById('authButton').onclick = async () => {
  const e = email.value.trim();
  const p = password.value;

  if (!e || !p) {
    message.textContent = 'Enter email and password.';
    return;
  }

  message.textContent = 'Connecting...';

  try {
    const result = isRegister
      ? await supabase.auth.signUp({ email: e, password: p })
      : await supabase.auth.signInWithPassword({ email: e, password: p });

    if (result.error) {
      message.textContent = JSON.stringify({
        name: result.error.name,
        message: result.error.message,
        status: result.error.status,
        code: result.error.code
      });
      return;
    }

    if (isRegister && !result.data.session) {
      message.textContent = 'Check your email to confirm registration.';
      return;
    }

    if (result.data.user) showDashboard(result.data.user);

  } catch (err) {
    message.textContent = err.name + ': ' + err.message;
  }
};

feed.querySelectorAll('.ai-analyze-button').forEach(button => {

      .querySelector('.ai-analysis-result');

    if (!article || !resultBox) return;

    const title = article.title.toLowerCase();

let sentiment = 'NEUTRAL';
let goldImpact = 'UNCERTAIN';
let usdImpact = 'UNCERTAIN';
let analysis = 'Insufficient information to determine market direction.';

// EVENT DETECTION
const isInflation = /cpi|pce|inflation|consumer price|prices/.test(title);
const isJobs = /nfp|nonfarm|payroll|employment|unemployment|jobless|wage|labor market|labour market|job creation|jobs report|initial jobless claims|continuing claims|average hourly earnings|private sector jobs|adp employment|employment growth/.test(title);

// DIRECTION KEYWORDS
const hotter = /hotter|higher|rises|rising|accelerates|accelerating|above forecast|beats expectations/.test(title);
const cooler = /cooler|lower|falls|falling|slows|slowing|below forecast|misses expectations|simmer down|cools|cooling|eases|easing|softens|softening|disinflation|moderates|moderating|price pressures decline|inflation declines/.test(title);

const weak = /weaker|weak growth|slumps|declines|contracts|misses expectations|below expectations|lower than expected|job growth slows|payrolls fall|employment falls|wages slow|unemployment rises|unemployment increases|job losses/.test(title);

const rising = /rising|surges|jumps|climbs|higher/.test(title);
const falling = /falling|drops|declines|lower/.test(title);

function bullishGold(reason) {
  sentiment = 'BULLISH';
  goldImpact = 'POTENTIALLY BULLISH';
  usdImpact = 'POTENTIALLY BEARISH';
  analysis = reason;
}

function bearishGold(reason) {
  sentiment = 'BEARISH';
  goldImpact = 'POTENTIALLY BEARISH';
  usdImpact = 'POTENTIALLY BULLISH';
  analysis = reason;
}

// INFLATION ANALYSIS
if (isInflation) {
  if (cooler) {

  } else if (hotter) {
    bearishGold('Hotter inflation may increase expectations of tighter Fed policy, potentially supporting USD.');
  }
}

// EMPLOYMENT ANALYSIS
else if (isJobs) {

    bullishGold('Weaker employment may increase expectations of monetary easing, potentially supporting gold.');
  } else if (strong) {
    bearishGold('Stronger employment may support USD and reduce expectations of near-term rate cuts.');

}

// FED ANALYSIS
else if (isFed) {
  if (dovish) {
    bullishGold('A dovish Federal Reserve stance may weaken USD and support gold.');
  } else if (hawkish) {
    bearishGold('A hawkish Federal Reserve stance may strengthen USD and pressure gold.');

}

else if (isYield) {
  if (rising) {
    bearishGold('Rising Treasury yields may increase the opportunity cost of holding non-yielding gold.');
  } else if (falling) {

}

}

// NO CLEAR EVENT DIRECTION
if (

  (isInflation || isJobs || isFed || isYield || isGDP)
) {
  analysis = 'Economic event detected, but the headline does not provide enough directional evidence.';
}
    resultBox.innerHTML = `
      <div class="ai-analysis-panel">
        <h4>📊 FREE MARKET ANALYSIS</h4>

        </p>

        <p><b>MARKET ANALYSIS:</b>

      </div>
    `;

    button.disabled = false;
    button.textContent = '📊 FREE MARKET ANALYSIS';

  });
});
    } catch (error) {
      status.textContent =
        'LIVE NEWS ERROR: ' + error.message;
    }
  }

  if (window.newsRefreshTimer) {
    clearInterval(window.newsRefreshTimer);
  }

  window.newsRefreshTimer =
    setInterval(loadNews, 300000);

}


if (module === 'calendar') {
  content.innerHTML = `
    <h3>ECONOMIC CALENDAR</h3>
    <p id="calendarStatus">Connecting to economic calendar...</p>
    <div class="calendar-filters">
  <select id="currencyFilter">
    <option value="ALL">ALL CURRENCIES</option>

    <option value="EUR">EUR</option>

</div>

<div id="calendarFeed"></div>
  `;

  async function loadCalendar() {
    const status = document.getElementById('calendarStatus');
    const feed = document.getElementById('calendarFeed');

    try {
      status.textContent = 'Updating economic events...';

      const response = await fetch('/api/calendar');

      if (!response.ok) {
        throw new Error('HTTP ' + response.status);
      }

      if (!data.success) {

      }

      const escapeHTML = value =>

          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        })[char]);

      const now = Date.now();

const impact = document.getElementById('impactFilter').value;

  .filter(event =>
    event.time &&

  )
  .filter(event =>

  )
  .sort((a, b) =>

  )
  .slice(0, 50);


      status.textContent =

      if (!events.length) {

      feed.innerHTML = events.map(event => {

            </p>
          </div>
        `;
      }).join('');
      
function updateCountdowns() {
  document.querySelectorAll('.event-countdown').forEach(timer => {
    const target = Number(timer.dataset.eventTime);
    const remaining = target - Date.now();

    if (remaining <= 0) {
      timer.textContent = 'EVENT RELEASED';
      return;
    }

    const totalSeconds = Math.floor(remaining / 1000);

    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    timer.textContent =
      `COUNTDOWN: ${days}D ${hours}H ${minutes}M ${seconds}S`;
  });
}

  clearInterval(window.eventCountdownTimer);
}

updateCountdowns();

window.eventCountdownTimer =
  setInterval(updateCountdowns, 1000);
