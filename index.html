  if (errorMessage.includes('DATA NOT FRESH')) {
    gateStatus = 'STALE DATA';
  }

  status.textContent =
    'SIGNAL ERROR: ' + errorMessage;

  const result = document.getElementById('signalResult');

  if (result) {
    result.innerHTML = `
      <div class="pattern-box">WAIT</div>

      <div class="result-row">
        <span class="result-label">SIGNAL SAFETY GATE</span>
        <span class="result-value">${gateStatus}</span>
      </div>

      <div class="result-row">
        <span class="result-label">REASON</span>
        <span class="result-value">${errorMessage}</span>
      </div>
    
    `;
  }
}

    button.disabled = false;
  };

  return;
}

if (module === 'status') {
  content.innerHTML = `
    <h3>🟢 LIVE MARKET STATUS</h3>
    <p>HAZZ ULTIMATE PRO • SYSTEM MONITOR</p>

    <div class="technical-result">
      <h4>MARKET CONNECTION</h4>
      <h2 id="overallStatus">CHECKING...</h2>
      <p id="lastChecked">Waiting for API response...</p>
      <p id="refreshCountdown">NEXT CHECK: 60s</p>
    </div>

    <div class="technical-result">
      <h4>TIMEFRAME HEALTH</h4>
      <div id="timeframeHealth"></div>
    </div>

    <div class="technical-result">
      <h4>SYSTEM INFORMATION</h4>
      <div class="result-row">
        <span class="result-label">PROVIDER</span>
        <span class="result-value">TWELVE DATA</span>
      </div>
      <div class="result-row">
        <span class="result-label">SYMBOL</span>
        <span class="result-value">XAUUSD</span>
      </div>
      <div class="result-row">
        <span class="result-label">AUTO REFRESH</span>
        <span class="result-value">60 SECONDS</span>
      </div>
    </div>

    <button id="refreshMarketStatus">REFRESH NOW</button>
  `;

  const frames = {
    M15: '15min',
    M30: '30min',
    H1: '1h',
    H4: '4h'
  };

  let countdown = 60;
  let checking = false;

  const health = document.getElementById('timeframeHealth');
  const overall = document.getElementById('overallStatus');
  const lastChecked = document.getElementById('lastChecked');
  const countdownDisplay = document.getElementById('refreshCountdown');

  async function checkMarketHealth() {
    if (checking) return;

    checking = true;
    overall.textContent = 'CHECKING...';

    const results = await Promise.all(
      Object.entries(frames).map(async ([tf, interval]) => {
        try {
          const response = await fetch(
            '/api/market?interval=' + interval
          );

          if (!response.ok) {
            throw new Error('HTTP ' + response.status);
          }

          const data = await response.json();

          if (
            !data.success ||
            !Array.isArray(data.candles) ||
            data.candles.length < 3
          ) {
            throw new Error('Invalid market data');
          }

          const candle = data.candles[0];

          const validPrices = [
            candle.open,
            candle.high,
            candle.low,
            candle.close
          ].every(value =>
            Number.isFinite(Number(value))
          );

          if (!validPrices) {
            throw new Error('Invalid candle prices');
          }

          const candleTime = new Date(
  candle.datetime.replace(' ', 'T') + '+08:00'
);

const rawAgeMinutes = Math.floor(
  (Date.now() - candleTime.getTime()) / 60000
);

const ageMinutes = Math.abs(rawAgeMinutes);

const timeValid = rawAgeMinutes >= 0;

const freshness = !timeValid
  ? 'TIME OFFSET'
  : ageMinutes <= ({
      M15: 20,
      M30: 40,
      H1: 75,
      H4: 270
    }[tf])
    ? 'FRESH'
    : 'STALE';

return {
  timeframe: tf,
  online: true,
  datetime: candle.datetime,
  ageMinutes: ageMinutes,
  freshness: freshness
};

        } catch (error) {
          return {
            timeframe: tf,
            online: false,
            datetime: error.message
          };
        }
      })
    );

    health.innerHTML = results.map(item => `
      <div class="result-row">
        <span class="result-label">${item.timeframe}</span>
        <span class="result-value">
          ${item.online ? '🟢 ONLINE' : '🔴 ERROR'}
        </span>
      </div>

      <div class="result-row">
        <span class="result-label">
          ${item.online ? 'LATEST CANDLE' : 'ERROR'}
        </span>
        <span class="result-value">
  ${item.datetime}
  ${item.online ? `
    <br>
    ${item.freshness} • ${item.ageMinutes} MIN AGO
  ` : ''}
</span>
      </div>
    `).join('');

    const onlineCount = results.filter(
      item => item.online
    ).length;

    overall.textContent =
      onlineCount === 4
        ? '🟢 ALL SYSTEMS ONLINE'
        : '🟠 PARTIAL CONNECTION';

    lastChecked.textContent =
      'LAST CHECKED: ' + new Date().toLocaleTimeString();

    checking = false;
  }

  document.getElementById('refreshMarketStatus').onclick = async () => {
    countdown = 60;
    await checkMarketHealth();
  };

  if (window.marketStatusTimer) {
    clearInterval(window.marketStatusTimer);
  }

  if (window.marketCountdownTimer) {
    clearInterval(window.marketCountdownTimer);
  }

  checkMarketHealth();

  window.marketStatusTimer = setInterval(() => {
    checkMarketHealth();
    countdown = 60;
  }, 60000);

  window.marketCountdownTimer = setInterval(() => {
    countdown = Math.max(0, countdown - 1);

    if (countdownDisplay) {
      countdownDisplay.textContent =
        'NEXT CHECK: ' + countdown + 's';
    }
  }, 1000);

  return;
}

content.innerHTML = `
  <h3>${selected[0]}</h3>
  <p>${selected[1]}</p>
  <p>MODULE INITIALIZING...</p>
`;
};
document.getElementById('logoutButton').onclick = async () => {
  await supabase.auth.signOut();
  showLogin();
};

const { data: { session } } = await supabase.auth.getSession();

if (session) showDashboard(session.user);

supabase.auth.onAuthStateChange((_event, session) => {
  if (session) showDashboard(session.user);
  else showLogin();
});
</script>
